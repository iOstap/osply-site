<script>
// ------------- HOME BOOT ------------- //
(function () {
  var d = document.documentElement;
  if (d.classList.contains('w-editor')) return;
  d.classList.add('osply-boot');
  try {
    var nav = performance.getEntriesByType('navigation')[0], ref = document.referrer ? new URL(document.referrer) : null;
    if (ref && ref.origin === location.origin && ref.pathname !== location.pathname && (!nav || nav.type === 'navigate' || nav.type === 'back_forward')) {
      window.__osplySoft = true; d.classList.add('osply-soft');
      if (window.osplyVT) window.osplyVT.hold = true;
    }
  } catch (e) {}
  setTimeout(function () { if (!window.__osplyHome) d.classList.remove('osply-boot'); }, 9000);
})();
</script>



<style>
